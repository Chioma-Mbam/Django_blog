{% extends "base.html" %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">
    <!-- left sidebar-->
    <!-- load sidebar.html here-->
    {% include "dashboard/sidebar.html" %}
    <!-- Right nav-bar -->
    <div class="col-md-9">
        <h3>Add New Category</h3>
        <form action="{% url "add_category" %}" method="post" style = "width:400px;">
            {% csrf_token %}

        </form>
        <br>
    </div>
</div>
{% endblock content %}
