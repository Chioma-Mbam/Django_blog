{% extends "base.html" %}
{% block content %}
<div class="row">
    <!-- left sidebar-->
    <!-- load sidebar.html here-->
    {% include "dashboard/sidebar.html" %}
    <!-- Right nav-bar -->
    <div class="col-md-9">
        <h3>All Categories
        <a href="{% url "add_category" %}" class="btn btn-dark text-light float-right mb-3">Add New</a></h3>
        <table class="table table-hover">
            <thead>
              <tr>
                <th>#</th>
                <th>Category</th>
                <th>created_at</th>
                <th>Updated_at</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
                {% for cat in categories %}
              <tr>
                <th scope="row"> {{ forloop.counter}} </th>
                <td> {{ cat }} </td>
                <td>{{ cat.created_at }}</td>
                <td>{{ cat.updated_at }}</td>
                <td><a  href="{% url "edit_category" cat.id %}" class="text-success"><i class="fa fa-edit"></i></a>
                    &nbsp;
                <a  href="{% url "delete_category" cat.id %}" class="text-danger"><i class="fa fa-trash"></i></a></td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
    </div>
</div>
{% endblock %}
