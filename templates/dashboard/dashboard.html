{% extends "base.html" %}

{% block content %}
<div class="row">
    <!-- left sidebar-->
    <!-- load sidebar.html here-->
    {% include "dashboard/sidebar.html" %}
    <!-- Right nav-bar -->
    <div class="col-md-9">
        <span class="d-inline-block pb-2">Logged in as  <b>{{ user }}</b> </span>
        <div class="row">
            <div class="col">
                <div class="card boarder-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All Categories</div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-dark text-center"> {{ category_count }} </h5>
                    </div>
                </div>
                
            </div>
            <div class="col">
                <div class="card boarder-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All Posts</div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-dark text-center"> {{ blog_count }} </h5>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>



{% endblock %}
